name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tests, and web build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            build-command: npm run electron:build -- --publish never
            unpacked: win-unpacked
          - name: linux-x64
            os: ubuntu-24.04
            build-command: npm run electron:build:linux:x64 -- --publish never
            unpacked: linux-unpacked
          - name: linux-arm64
            os: ubuntu-24.04-arm
            build-command: npm run electron:build:linux:arm64 -- --publish never
            unpacked: linux-arm64-unpacked
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libasound2t64 libgbm1
      - run: npm ci
      - name: Build installers
        run: ${{ matrix.build-command }}
      - name: Find unpacked application
        shell: bash
        run: echo "APP_DIRECTORY=release/$(node -p 'require("./package.json").version')/${{ matrix.unpacked }}" >> "$GITHUB_ENV"
      - name: Smoke test Windows application
        if: runner.os == 'Windows'
        run: node scripts/electron-smoke.mjs "$env:APP_DIRECTORY"
      - name: Smoke test Linux application
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/electron-smoke.mjs "$APP_DIRECTORY"
      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-smoke-${{ matrix.name }}
          path: test-results/electron/
          if-no-files-found: warn
          retention-days: 7

  artifacts:
    name: Verify artifact download
    needs: desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-smoke-*
          path: smoke-results
      - name: Verify all platform results
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          for (const target of ['windows-x64', 'linux-x64', 'linux-arm64']) {
            const result = JSON.parse(readFileSync(`smoke-results/desktop-smoke-${target}/result.json`, 'utf8'))
            assert.equal(result.passed, true, target)
            console.log(`${target}: passed`)
          }
          JS
