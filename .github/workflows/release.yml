name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            build-command: npm run electron:build -- --publish never
          - name: windows-x64
            os: windows-latest
            build-command: npm run electron:build -- --publish never
          - name: linux-x64
            os: ubuntu-24.04
            build-command: npm run electron:build:linux:x64 -- --publish never
          - name: linux-arm64
            os: ubuntu-24.04-arm
            build-command: npm run electron:build:linux:arm64 -- --publish never
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build & package Electron app
        env:
          VITE_KLIPY_API_KEY: ${{ secrets.VITE_KLIPY_API_KEY }}
          # macOS signing + notarization (only injected on macOS runner)
          CSC_LINK: ${{ matrix.os == 'macos-14' && secrets.MAC_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-14' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.os == 'macos-14' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos-14' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-14' && secrets.APPLE_TEAM_ID || '' }}
        run: ${{ matrix.build-command }}

      - name: Archive desktop source maps and matching bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-maps-${{ matrix.name }}-${{ github.sha }}
          path: |
            dist/**/*.js
            dist/**/*.map
            dist-electron/**/*.js
            dist-electron/**/*.cjs
            dist-electron/**/*.map
          if-no-files-found: error
          retention-days: 90

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jumble-${{ matrix.name }}
          path: |
            release/*/*.dmg
            release/*/*.dmg.blockmap
            release/*/*.zip
            release/*/*.zip.blockmap
            release/*/*.exe
            release/*/*.exe.blockmap
            release/*/*.AppImage
            release/*/*.AppImage.blockmap
            release/*/*-arm64.AppImage
            release/*/*-arm64.AppImage.blockmap
            release/*/*.deb
            release/*/*-arm64.deb
            release/*/latest*.yml
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Build Android APK and AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PYTHON'
          import base64
          import os
          from pathlib import Path

          required = ('ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD')
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing Android release secrets: ' + ', '.join(missing))
          key = base64.b64decode(''.join(os.environ['ANDROID_KEYSTORE_BASE64'].split()), validate=True)
          path = Path(os.environ['RUNNER_TEMP']) / 'jumble-release.keystore'
          with os.fdopen(os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), 'wb') as output:
              output.write(key)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'ANDROID_KEYSTORE_PATH={path}\n')
          PYTHON

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'

      - name: Install dependencies
        run: npm ci

      - name: Build Android web assets
        env:
          VITE_KLIPY_API_KEY: ${{ secrets.VITE_KLIPY_API_KEY }}
        run: npm run android:build

      - name: Build signed release APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/android.mjs bundle :app:assembleRelease

      - name: Verify signatures and collect release files
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify android/app/build/outputs/apk/release/app-release.apk
          python3 - <<'PYTHON'
          import shutil
          import subprocess
          from pathlib import Path

          bundle = Path('android/app/build/outputs/bundle/release/app-release.aab')
          verification = subprocess.run(['jarsigner', '-J-Duser.language=en', '-J-Duser.country=US', '-verify', str(bundle)], check=True, capture_output=True, text=True)
          if 'jar verified.' not in verification.stdout:
              raise SystemExit('Android bundle signature verification failed')
          target = Path('release/android')
          target.mkdir(parents=True, exist_ok=True)
          shutil.copy2('android/app/build/outputs/apk/release/app-release.apk', target / 'Jumble-android.apk')
          shutil.copy2(bundle, target / 'Jumble-android.aab')
          PYTHON

      - name: Archive Android source maps and matching bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-maps-android-${{ github.sha }}
          path: |
            dist-android/**/*.js
            dist-android/**/*.map
          if-no-files-found: error
          retention-days: 90

      - name: Upload Android artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jumble-android
          path: |
            release/android/*.apk
            release/android/*.aab
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/jumble-release.keystore"

  flatpak:
    name: Build Flatpak (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            os: ubuntu-24.04
          - name: aarch64
            os: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Flatpak toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder pipx
          pipx install 'git+https://github.com/flatpak/flatpak-builder-tools.git#subdirectory=node'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Generate Flatpak npm sources
        run: npm run flatpak:generate-sources

      - name: Build Flatpak repository
        run: |
          flatpak-builder \
            --force-clean \
            --user \
            --install-deps-from=flathub \
            --repo=flatpak/repo \
            flatpak/build-dir \
            flatpak/com.codytseng.jumble.yml

      - name: Build Flatpak bundle
        run: |
          mkdir -p release/flatpak
          flatpak build-bundle \
            flatpak/repo \
            release/flatpak/Jumble-linux-${{ matrix.name }}.flatpak \
            com.codytseng.jumble \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jumble-flatpak-${{ matrix.name }}
          path: release/flatpak/*.flatpak
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build, flatpak, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: jumble-*
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
